<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Spelling Adventure</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <h1>🪄 Spelling Adventure</h1>
        <p>Practice, earn points, build a streak, and master every word.</p>
      </div>
      <button id="parentBtn" class="secondary compact" type="button">⚙️ Change Words</button>
    </header>

    <section class="stats" aria-label="Game statistics">
      <div><span>⭐ Score</span><strong id="score">0</strong></div>
      <div><span>🔥 Streak</span><strong id="streak">0</strong></div>
      <div><span>✅ Correct</span><strong id="correct">0</strong></div>
      <div><span>🏆 Best</span><strong id="best">0</strong></div>
    </section>

    <section class="card">
      <label for="modeSelect" class="section-label">Choose a game</label>
      <select id="modeSelect">
        <option value="hear">🔊 Hear It & Spell It</option>
        <option value="pick">🎯 Pick the Correct Spelling</option>
        <option value="unscramble">🧩 Unscramble</option>
        <option value="missing">🔤 Missing Letters</option>
        <option value="hangman">🪢 Hangman</option>
      </select>
    </section>

    <section id="gameCard" class="card game-card"></section>

    <section id="feedback" class="feedback hidden" aria-live="polite"></section>

    <button id="nextBtn" class="primary full hidden" type="button">Next Word ➜</button>

    <section class="card progress-card">
      <button id="wordsToggle" class="plain-toggle" type="button">📚 Show this week's words</button>
      <div id="wordListPanel" class="hidden"></div>
    </section>
  </main>

  <dialog id="parentDialog">
    <form method="dialog" class="parent-panel">
      <div class="dialog-head">
        <div>
          <h2>👩‍🏫 Parent Setup</h2>
          <p>Replace the spelling list anytime.</p>
        </div>
        <button value="cancel" class="icon-btn" aria-label="Close">✕</button>
      </div>

      <label for="wordText">Enter spelling words</label>
      <textarea id="wordText" rows="12" placeholder="Enter one word per line, or separate words with commas"></textarea>
      <p class="helper">You can type or paste the weekly words here.</p>

      <div id="uploadMessage" class="mini-message" aria-live="polite"></div>

      <div class="dialog-actions">
        <button id="loadWordsBtn" class="primary" type="button">Use This Word List</button>
        <button id="resetScoresBtn" class="secondary" type="button">Reset Scores</button>
      </div>

      <p class="loaded-count">Words loaded: <strong id="loadedCount">0</strong></p>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
